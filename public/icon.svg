<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="teaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2b1e" />
      <stop offset="65%" stop-color="#0a120c" />
      <stop offset="100%" stop-color="#040805" />
    </radialGradient>
    <linearGradient id="teaLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="50%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#d45b00" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e000" />
      <stop offset="100%" stop-color="#38b000" />
    </linearGradient>
    <linearGradient id="vpnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#70e000" />
    </linearGradient>
    <filter id="teaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#teaBg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(112, 224, 0, 0.25)" stroke-width="3" />

  <!-- Steam particles -->
  <path d="M 220 150 Q 200 110 220 80 Q 240 50 220 20" fill="none" stroke="#ffb703" stroke-width="6" stroke-linecap="round" opacity="0.6" filter="url(#teaGlow)"/>
  <path d="M 260 140 Q 280 100 260 70 Q 240 40 260 15" fill="none" stroke="#70e000" stroke-width="7" stroke-linecap="round" opacity="0.8" filter="url(#teaGlow)"/>
  <path d="M 300 155 Q 320 115 300 85 Q 280 55 300 25" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" opacity="0.6" filter="url(#teaGlow)"/>

  <!-- Smart ITea Mug Body -->
  <rect x="156" y="170" width="190" height="210" rx="40" fill="#141f17" stroke="#70e000" stroke-width="8" filter="url(#teaGlow)" />
  
  <!-- Mug Handle -->
  <path d="M 346 210 C 410 210, 420 310, 346 325" fill="none" stroke="#70e000" stroke-width="14" stroke-linecap="round" />

  <!-- Tea Liquid inside cup display -->
  <rect x="174" y="240" width="154" height="120" rx="20" fill="url(#teaLiquid)" />
  
  <!-- Tea Leaf Logo on the Mug -->
  <path d="M 251 250 C 215 285, 220 330, 251 345 C 282 330, 287 285, 251 250 Z" fill="url(#leafGrad)" />
  <path d="M 251 250 L 251 345" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />

  <!-- VPN Wi-Fi Waves around Cup (Tea_VPN) -->
  <path d="M 120 180 A 180 180 0 0 1 382 180" fill="none" stroke="url(#vpnGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 10" opacity="0.85" filter="url(#teaGlow)" />
  <path d="M 90 140 A 220 220 0 0 1 412 140" fill="none" stroke="url(#vpnGrad)" stroke-width="7" stroke-linecap="round" opacity="0.6" filter="url(#teaGlow)" />

  <!-- Subtitle Badge ITea.inc -->
  <rect x="156" y="415" width="200" height="42" rx="12" fill="#00f0ff" opacity="0.15" />
  <rect x="156" y="415" width="200" height="42" rx="12" fill="none" stroke="#00f0ff" stroke-width="2" />
  <text x="256" y="443" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="3">ITea.inc</text>
</svg>
