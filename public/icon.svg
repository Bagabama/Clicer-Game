<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c38" />
      <stop offset="70%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00f0ff" />
      <stop offset="65%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="3" />

  <!-- Outer Reactor Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad1)" stroke-width="4" stroke-dasharray="24 16" opacity="0.6" />
  
  <!-- Containment Brackets -->
  <path d="M 256 36 L 256 66 M 256 446 L 256 476 M 36 256 L 66 256 M 446 256 L 476 256" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)"/>
  
  <!-- Middle Rotator Ring -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#ringGrad2)" stroke-width="8" stroke-dasharray="140 30 50 30" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#ff007a" stroke-width="5" stroke-dasharray="60 40" opacity="0.8" />

  <!-- Core Plasma Ball -->
  <circle cx="256" cy="256" r="90" fill="url(#coreGlow)" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="38" fill="#ffffff" filter="url(#neonGlow)" />

  <!-- Energy Pylons -->
  <polygon points="256,190 270,225 256,215 242,225" fill="#00f0ff" />
  <polygon points="256,322 270,287 256,297 242,287" fill="#00f0ff" />
  <polygon points="190,256 225,270 215,256 225,242" fill="#ff007a" />
  <polygon points="322,256 287,270 297,256 287,242" fill="#ff007a" />
</svg>
